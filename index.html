<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div id="app">
        <!-- Background Music -->
        <audio id="bgMusic" loop>
            <source src="assets/bgm.mp3" type="audio/mpeg">
            <!-- Fallback if user doesn't provide file yet -->
        </audio>

        <!-- Intro / Permission Screen -->
        <section id="introScreen" class="screen active">
            <div class="content intro-content">
                <i data-feather="mic" class="mic-icon fade-in"></i>
                <h1 class="fade-in delay-1" style="font-size: 2.2rem; font-weight: 300; margin-bottom: 1rem; color: var(--accent);">Our Moment</h1>
                <p class="fade-in delay-2" style="font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 2.5rem; font-weight: 200;">아주 특별한 마법을 위해<br><strong>마이크 접근 권한</strong>이 필요합니다.</p>
                <button class="btn fade-in delay-3" onclick="startApp()">시작하기</button>
            </div>
        </section>

        <!-- Elegant Candle Screen -->
        <section id="cakeScreen" class="screen">
            <div class="content cake-content">
                <h2 class="fade-in" style="font-weight: 200; font-size: 1.5rem; letter-spacing: 1px; margin-bottom: 3rem;">소원을 빌고,<br>천천히 입김을 불어주세요.</h2>
                
                <div class="cake-container fade-in delay-1">
                    <div class="candle-wrapper" id="candleWrapper">
                        <div class="candle"></div>
                        <div id="flame" class="flame"></div>
                    </div>
                </div>
                
                <p class="hint-text fade-in delay-2">입김이 닿지 않는다면 촛불을 살짝 터치해주세요</p>
                
                <div class="audio-meter fade-in delay-2">
                    <div class="meter-bar" id="meterBar"></div>
                </div>
            </div>
        </section>

        <!-- Darkness Transition Screen -->
        <section id="darkScreen" class="screen" style="background: #000; transition: background 2s;">
        </section>

        <!-- Proposal Climax Screen with Memories -->
        <section id="proposalScreen" class="screen">
            <div id="flowers"></div>
            <div id="memories">
                <!-- User's memory photos will be rendered here via JS -->
            </div>
            
            <div class="content proposal-content">
                <h1 class="fade-in" style="font-weight: 200; font-size: 1.4rem; color: rgba(255,255,255,0.8); margin-bottom: 0.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">우리의 모든 소원이 이루어지는 곳,</h1>
                <h1 class="fade-in delay-1" style="font-size: 2.8rem; font-weight: 500; margin-bottom: 3.5rem; letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.9);">나와 결혼해 줄래? 💍</h1>
                
                <div class="button-group fade-in delay-2">
                    <button class="btn yes-btn" onclick="acceptProposal()">Yes</button>
                    <button class="btn no-btn" id="noBtn">No</button>
                </div>
            </div>
        </section>

        <!-- Success Screen -->
        <section id="successScreen" class="screen">
            <div class="content">
                <h1 class="fade-in" style="font-size: 3rem; font-weight: 300; color: var(--accent); margin-bottom: 1rem;">Thank you</h1>
                <p class="fade-in delay-1" style="font-size: 1.2rem; font-weight: 200;">영원히 변치 않는 빛이 될게.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
