<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div id="app">
        <!-- Intro / Permission Screen -->
        <section id="introScreen" class="screen active">
            <div class="content intro-content">
                <i data-feather="mic" class="mic-icon fade-in"></i>
                <h1 class="fade-in delay-1" style="font-family: 'Great Vibes', cursive; font-size: 3.5rem; margin-bottom: 0.5rem; color: #ffb6c1;">Happy Birthday</h1>
                <p class="fade-in delay-2" style="font-size: 1.1rem; margin-bottom: 2rem;">특별한 8월 6일,<br>마법 같은 이벤트를 위해 <strong>마이크 접근 권한</strong>이 필요합니다.</p>
                <button class="btn fade-in delay-3" onclick="startMic()">마법 시작하기</button>
            </div>
        </section>

        <!-- Cake & Candle Screen -->
        <section id="cakeScreen" class="screen">
            <div class="content cake-content">
                <h2 class="fade-in">소원을 빌고,<br>가까이 다가와 입김을 '후~' 불어주세요!</h2>
                
                <div class="cake-container fade-in delay-1">
                    <div class="candle">
                        <div id="flame" class="flame"></div>
                    </div>
                    <div class="cake-top"></div>
                    <div class="cake-bottom"></div>
                </div>
                
                <div class="audio-meter fade-in delay-2">
                    <div class="meter-bar" id="meterBar"></div>
                </div>
            </div>
        </section>

        <!-- Darkness Transition Screen -->
        <section id="darkScreen" class="screen" style="background: #000; transition: background 2s;">
            <!-- Pitch black for a moment before flowers bloom -->
        </section>

        <!-- Proposal Climax Screen -->
        <section id="proposalScreen" class="screen">
            <!-- Flower/Particle container -->
            <div id="flowers"></div>
            
            <div class="content proposal-content">
                <h1 class="fade-in" style="font-weight: 300;">우리의 모든 소원이 이루어지는 날,</h1>
                <h1 class="fade-in delay-1" style="font-size: 2.5rem; font-weight: 600; margin-bottom: 3rem;">나와 결혼해 줄래? 💍</h1>
                
                <div class="button-group fade-in delay-2">
                    <button class="btn yes-btn" onclick="acceptProposal()">응! (Yes)</button>
                    <button class="btn no-btn" id="noBtn">아니 (No)</button>
                </div>
            </div>
        </section>

        <!-- Success Screen -->
        <section id="successScreen" class="screen">
            <div class="content">
                <h1 class="bounce" style="font-size: 3rem; color: #ffb6c1;">고마워! 사랑해 ❤️</h1>
                <p style="font-size: 1.2rem;">평생 너의 가장 든든한 내 편이 되어줄게.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
