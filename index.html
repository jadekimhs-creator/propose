<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리의 기적, 그리고 뀰이</title>
    <link rel="stylesheet" href="style.css?v=26">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div id="app">
        <!-- Global Progress Bar & Skip Area -->
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>
        <div id="skipBackOverlay" onclick="skipPrevious()"></div>
        <div id="skipOverlay" onclick="skipCurrent()"></div>

        <!-- Background Music -->
        <audio id="bgMusic" loop>
            <source src="assets/bgm.mp3" type="audio/mpeg">
        </audio>

        <!-- Start Screen (Envelope / Tap to Start) -->
        <section id="startScreen" class="screen active" style="background-color: #000; z-index: 50;">
            <div class="content" style="text-align: center;">
                <button class="btn pulse" onclick="beginProposal()" style="padding: 20px 50px; font-size: 1.3rem; letter-spacing: 2px; border-radius: 50px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 30px rgba(229,168,114,0.1);">
                    <i data-feather="mail" style="margin-right: 10px;"></i> 우리의 기적 열어보기
                </button>
                <p style="margin-top: 2rem; color: rgba(255,255,255,0.5); font-size: 0.9rem; font-weight: 200;">화면을 터치해 주세요</p>
            </div>
        </section>

        <!-- Scene 0: Permission & Start -->
        <section id="introScreen" class="screen" style="overflow: hidden; background: #000;">
            <!-- Cinematic Background -->
            <div class="intro-bg"></div>
            <!-- Particles Container -->
            <div id="introParticles"></div>
            
            <div class="content intro-content" style="padding: 5rem 3rem; z-index: 10; background: transparent; border: none; box-shadow: none; backdrop-filter: none;">
                <h1 id="typewriter1" style="font-size: 2.2rem; font-weight: 200; margin-bottom: 1.5rem; color: rgba(255,255,255,0.95); letter-spacing: 1px; min-height: 40px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
                </h1>
                <p id="typewriter2" style="font-size: 1.15rem; color: rgba(255,255,255,0.8); margin-bottom: 3.5rem; font-weight: 200; line-height: 1.8; min-height: 60px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
                </p>
                <button class="btn" id="startBtn" onclick="runCinematicSequence()" style="padding: 16px 42px; font-size: 1.15rem; letter-spacing: 2px; opacity: 0; transform: translateY(15px); transition: all 1s ease;">다음으로</button>
            </div>
        </section>

        <!-- Scene 1: Prologue (Black screen, text fades in and out) -->
        <section id="prologueScreen" class="screen" style="background-color: #000;">
            <div class="content prologue-content">
                <h2 id="prologueText1" class="cinematic-text typewriter-element" data-text="우리가 서로를 알아보고, 사랑에 빠지고..."></h2>
                <h2 id="prologueText2" class="cinematic-text typewriter-element" data-text="함께하는 매 순간이 기적 같았던 날들."></h2>
            </div>
        </section>

        <!-- Scene 2: The Candle -->
        <section id="cakeScreen" class="screen">
            <div class="content cake-content">
                <h2 class="cinematic-text-small typewriter-element" data-text="오늘은 세상에서 가장 특별한 너의 생일." style="margin-bottom: 1rem; min-height: 1.5em;"></h2>
                <h2 class="cinematic-text-small typewriter-element" data-text="우리에게 찾아온 든든한 아들 '뀰이'와 함께 맞이하는 첫 생일이네." style="margin-bottom: 1rem; min-height: 1.5em;"></h2>
                <h2 class="cinematic-text-small typewriter-element" data-text="우리의 더 찬란한 내일을 위해,\n소원을 빌고 촛불을 꺼줄래?" style="margin-bottom: 3rem; color: var(--accent); min-height: 3em;"></h2>
                
                <div class="cake-container" style="opacity: 0; transition: opacity 1s ease;" id="cakeVisual">
                    <div class="candle-wrapper" id="candleWrapper">
                        <div class="candle"></div>
                        <div id="flame" class="flame"></div>
                    </div>
                </div>
                
                <p class="hint-text typewriter-element" data-text="촛불을 살짝 터치해서 꺼주세요" style="font-size: 1.1rem; color: rgba(255,255,255,0.7); min-height: 1.5em;"></p>
            </div>
        </section>

        <!-- Darkness Transition Screen -->
        <section id="darkScreen" class="screen" style="background: #000; transition: background 2s;">
        </section>

        <!-- Scene 3: The Memories (Sequenced Photos) -->
        <section id="memoryScreen" class="screen" style="background: #050508;">
            <div id="memoryContainer" class="memory-container">
            </div>
        </section>

        <!-- Scene 4: Proposal Climax -->
        <section id="proposalScreen" class="screen">
            <div id="flowers"></div>
            <!-- Background scattered photos -->
            <div id="scatteredMemories"></div>
            
            <div class="content proposal-content">
                <h1 class="typewriter-element" data-text="나의 영원한 사랑 이자 내 삶의 전부인 다운천사에게" style="font-weight: 200; font-size: 1.35rem; line-height: 1.5; color: rgba(255,255,255,0.9); margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); min-height: 1.5em;"></h1>
                <h1 class="typewriter-element" data-text="너의 남편, 우리 멋진 아들 뀰이의 아빠, 은비의 든든한 보호자로써\n평생 너희들의 큰 나무가 되어 비바람을 막아줄게." style="font-weight: 200; font-size: 1.35rem; line-height: 1.6; color: rgba(255,255,255,0.9); margin-bottom: 2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); min-height: 3.2em;"></h1>
                <h1 class="typewriter-element" data-text="나와 결혼해 줄래? 💍" style="font-size: 2.8rem; font-weight: 500; margin-bottom: 3.5rem; letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.9); color: var(--accent); min-height: 1.5em;"></h1>
                
                <div class="button-group" style="opacity: 0; transform: translateY(15px); transition: all 1s ease;" id="proposalBtns">
                    <button class="btn yes-btn" onclick="acceptProposal()">Yes</button>
                    <button class="btn no-btn" id="noBtn">No</button>
                </div>
            </div>
        </section>

        <!-- Success Screen -->
        <section id="successScreen" class="screen" style="background-color: #020205;">
            <!-- Starlight canvas/container -->
            <div id="starfield"></div>
            
            <div class="content" style="z-index: 10;">
                <div id="successLine" style="width: 2px; height: 0px; background: linear-gradient(to bottom, transparent, var(--accent), transparent); margin: 0 auto 2rem auto; opacity: 0; transition: all 1.5s ease;"></div>
                
                <h1 class="typewriter-element" data-text="나의 가장 눈부신 대답이 되어주어 고마워." style="font-size: 2.2rem; font-weight: 200; line-height: 1.5; color: rgba(255,255,255,0.95); margin-bottom: 2.5rem; text-shadow: 0 0 20px rgba(229,168,114,0.3); min-height: 1.5em;"></h1>
                
                <p class="typewriter-element" data-text="우리가 걸어온 모든 어제와,\n앞으로 마주할 수많은 내일들이\n저 별빛처럼 영원히 찬란하도록 지켜줄게." style="font-size: 1.15rem; font-weight: 200; color: rgba(255,255,255,0.7); margin-bottom: 3rem; line-height: 1.8; min-height: 5.4em;"></p>

                <p class="typewriter-element" data-text="이제 화면 속 이야기는 여기서 끝나지만,\n우리의 진짜 기적은 지금부터 시작이야." style="font-size: 1.3rem; font-weight: 200; color: rgba(255,255,255,0.9); margin-bottom: 3.5rem; line-height: 1.6; min-height: 3.2em;"></p>

                <p class="typewriter-element glow-pulse" data-text="고개를 들어 나를 바라봐줄래? 💐" style="font-size: 1.7rem; font-weight: 400; color: var(--accent); letter-spacing: 2px; text-shadow: 0 0 15px rgba(229,168,114,0.6); min-height: 1.5em;"></p>
            </div>
        </section>
    </div>

    <script src="script.js?v=27"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
